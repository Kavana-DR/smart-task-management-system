<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Task Management System</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-container body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Decorative elements -->
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-tasks"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to your Smart Task Management System</p>
      </div>

      <form class="form-group" data-storage-key="user-login">
        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="form-label">
            <i class="fas fa-envelope" style="margin-right: 0.5rem;"></i>Email Address
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            required
          >
          <div class="form-helper">We'll never share your email with anyone.</div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="fas fa-lock" style="margin-right: 0.5rem;"></i>Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
          >
          <div class="form-helper">Must be at least 8 characters.</div>
        </div>

        <!-- Remember & Forgot -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" name="remember" style="cursor: pointer;">
            <span style="font-size: 0.9rem;">Remember me</span>
          </label>
          <a href="#" style="font-size: 0.9rem;">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1rem;">
          <i class="fas fa-sign-in-alt"></i>Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">Or continue with</div>

      <!-- Social Buttons -->
      <div class="social-buttons">
        <button type="button" class="social-btn">
          <i class="fab fa-google"></i>Google
        </button>
        <button type="button" class="social-btn">
          <i class="fab fa-microsoft"></i>Microsoft
        </button>
      </div>

      <!-- Footer Link -->
      <div class="form-footer auth-link">
        Don't have an account? <a href="register.html">Sign up for free</a>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="assets/js/script.js"></script>
</body>
</html>
