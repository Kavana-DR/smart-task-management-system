<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Task Management System</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-tasks"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Register for the Smart Task Management System</p>
      </div>

      <form class="form-group" data-storage-key="user-register">
        <div class="form-group">
          <label for="registerName" class="form-label">
            <i class="fas fa-user" style="margin-right: 0.5rem;"></i>Name
          </label>
          <input
            type="text"
            id="registerName"
            name="name"
            class="form-input"
            placeholder="Enter your name"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerEmail" class="form-label">
            <i class="fas fa-envelope" style="margin-right: 0.5rem;"></i>Email Address
          </label>
          <input
            type="email"
            id="registerEmail"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPassword" class="form-label">
            <i class="fas fa-lock" style="margin-right: 0.5rem;"></i>Password
          </label>
          <input
            type="password"
            id="registerPassword"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">
            <i class="fas fa-lock" style="margin-right: 0.5rem;"></i>Confirm Password
          </label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
            placeholder="Re-enter your password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1rem;">
          <i class="fas fa-user-plus"></i>Register
        </button>
      </form>

      <div class="form-footer auth-link">
        Already have an account? <a href="index.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
